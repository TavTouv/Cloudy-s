<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudy’s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  ========================  RÉGLAGES  ========================
  API_URL   : URL de ton Apps Script (se termine par /exec). Active les comptes et le paiement sécurisé.
  PAYPAL_ID : ton Client ID PayPal (jamais le Secret).
  CSV_URL   : facultatif, seulement si tu n’utilises pas encore API_URL.
  Colonnes de la Sheet : nom | prix | description | image | categorie | stock | badge
  ============================================================
-->
<script>
  const CONFIG = {
    NOM_BOUTIQUE: "Cloudy’s",
    SLOGAN: "Goodies doux et précieux, imprimés à la demande",
    API_URL: "",
    PAYPAL_ID: "",
    CSV_URL: "",
    DEVISE: "EUR",
    FRAIS_PORT: 4.90,               // utilisés seulement sans API_URL (sinon Code.gs décide)
    SEUIL_LIVRAISON_GRATUITE: 50
  };
</script>

<style>
  :root {
    --porcelain: #fdfbfc; --pearl: #f6eef3; --line: #ecdde6;
    --blush: #f9cfe0; --rose: #e389b0; --baby: #cfe8f6; --sky: #9fd2ee;
    --ink: #5b4a5f; --ink-soft: #94818f; --focus: #7fb9dd; --danger: #c4547f;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --porcelain: #1f1b29; --pearl: #2a2436; --line: #3d3449;
      --blush: #6e4a62; --rose: #f2a9c9; --baby: #33475e; --sky: #8cc6e6;
      --ink: #f4e9f0; --ink-soft: #c2b0bf; --focus: #a8d6f2; --danger: #ff9cc0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --porcelain: #1f1b29; --pearl: #2a2436; --line: #3d3449;
    --blush: #6e4a62; --rose: #f2a9c9; --baby: #33475e; --sky: #8cc6e6;
    --ink: #f4e9f0; --ink-soft: #c2b0bf; --focus: #a8d6f2; --danger: #ff9cc0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--porcelain); color: var(--ink);
    font-family: "Quicksand", "Nunito", system-ui, sans-serif; font-weight: 500;
    line-height: 1.6; overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 999px; }
  .serif { font-family: "Cormorant Garamond", "Garamond", "Times New Roman", serif; }
  .muted { color: var(--ink-soft); }

  .pill {
    cursor: pointer; border-radius: 999px; padding: 8px 16px; font-size: .9rem; font-weight: 600;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  .pill.solid { background: var(--baby); border-color: var(--baby); }
  .pill.rose { background: var(--blush); border-color: var(--blush); }
  .pill.wide { width: 100%; padding: 12px 16px; }
  .pill:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Barre du haut ---------- */
  .topbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    max-width: 1180px; margin: 0 auto; padding: 16px 20px;
  }
  .brand-small { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.7rem; color: var(--rose); text-decoration: none; }
  .actions { justify-self: end; display: flex; align-items: center; gap: 10px; }
  .search {
    width: 190px; font: inherit; font-size: .9rem; color: var(--ink);
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--pearl);
  }
  .search::placeholder { color: var(--ink-soft); }
  .cart-btn { position: relative; }
  .count {
    display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 6px;
    border-radius: 999px; background: var(--rose); color: var(--porcelain); font-size: .75rem; font-weight: 700;
  }
  .count[hidden] { display: none; }

  /* ---------- Bannière ---------- */
  .hero {
    position: relative; margin: 0 auto; max-width: 1180px; height: clamp(300px, 50vw, 460px);
    border-radius: 0 0 40px 40px; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(60% 70% at 18% 30%, var(--blush) 0, transparent 70%),
      radial-gradient(55% 65% at 82% 25%, var(--baby) 0, transparent 70%),
      radial-gradient(70% 60% at 60% 95%, var(--sky) 0, transparent 70%),
      radial-gradient(50% 50% at 10% 100%, var(--baby) 0, transparent 70%),
      var(--pearl);
  }
  .puff { position: absolute; border-radius: 50%; background: var(--porcelain); filter: blur(22px); opacity: .85; z-index: -1; }
  .p1 { width: 340px; height: 120px; left: -60px; bottom: 30px; }
  .p2 { width: 280px; height: 90px; right: -40px; top: 60px; opacity: .7; }
  .p3 { width: 420px; height: 140px; left: 40%; bottom: -60px; }
  .hero-inner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 20px; }
  .hero h1 {
    margin: 0; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
    font-size: clamp(4rem, 15vw, 9.5rem); line-height: .9; letter-spacing: -.01em;
    animation: settle 1.6s ease-out both;
  }
  .hero p { margin: 18px auto 0; max-width: 34ch; color: var(--ink-soft); font-size: clamp(.95rem, 2.6vw, 1.1rem); }
  @keyframes settle { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* ---------- Collection ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 56px 20px 80px; }
  .intro { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 36px; }
  .intro h2 { margin: 0; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab { cursor: pointer; font-size: .9rem; font-weight: 600; padding: 7px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); }
  .tab:nth-child(even)[aria-pressed="true"] { background: var(--baby); border-color: var(--baby); color: var(--ink); }
  .tab:nth-child(odd)[aria-pressed="true"]  { background: var(--blush); border-color: var(--blush); color: var(--ink); }

  .notice { margin: 0 0 32px; padding: 12px 18px; border-radius: 16px; background: var(--pearl); border: 1px solid var(--line); color: var(--ink-soft); font-size: .9rem; }

  .grid { display: grid; gap: 52px 28px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .product { display: flex; flex-direction: column; }
  .visual { position: relative; aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden; background: var(--pearl); display: grid; place-items: center; }
  .visual img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s ease; }
  .product:hover .visual img { transform: scale(1.03); }
  .visual.placeholder.pink { background: radial-gradient(80% 70% at 30% 20%, var(--blush), var(--pearl)); }
  .visual.placeholder.blue { background: radial-gradient(80% 70% at 70% 20%, var(--baby), var(--pearl)); }
  .monogram { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 5rem; color: var(--porcelain); }
  .badge { position: absolute; top: 14px; left: 14px; padding: 4px 12px; border-radius: 999px; background: var(--porcelain); color: var(--rose); font-size: .78rem; font-weight: 700; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 16px; }
  .product h3 { margin: 0; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 1.45rem; line-height: 1.15; }
  .price { white-space: nowrap; font-weight: 600; }
  .cat { margin: 4px 0 0; font-size: .82rem; color: var(--rose); font-weight: 600; }
  .desc { margin: 8px 0 16px; font-size: .92rem; color: var(--ink-soft); flex: 1; }
  .soldout { padding: 10px; border-radius: 999px; text-align: center; font-size: .88rem; font-weight: 600; background: var(--pearl); color: var(--ink-soft); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--ink-soft); padding: 40px 0; }

  footer { border-top: 1px solid var(--line); max-width: 1180px; margin: 0 auto; padding: 36px 20px 56px; text-align: center; color: var(--ink-soft); font-size: .88rem; }
  footer .serif { font-style: italic; font-size: 1.8rem; color: var(--rose); margin: 0 0 14px; }
  footer nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 26px; margin-bottom: 12px; }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--blush); }

  /* ---------- Panier (tiroir) ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(91, 74, 95, .28); backdrop-filter: blur(4px); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(430px, 100%);
    background: var(--porcelain); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(100%); transition: transform .4s cubic-bezier(.2, .8, .2, 1);
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .drawer-head h2 { margin: 0; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 2.1rem; }
  .close { cursor: pointer; border: 0; background: var(--pearl); width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; }
  .lines { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
  .line { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .line .mini { width: 64px; height: 80px; border-radius: 16px; overflow: hidden; background: var(--blush); display: grid; place-items: center; }
  .line .mini img { width: 100%; height: 100%; object-fit: cover; }
  .line .mini span { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.8rem; color: var(--porcelain); }
  .line h4 { margin: 0 0 6px; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 1.15rem; line-height: 1.2; }
  .qty { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .qty button { cursor: pointer; border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%; font-size: 1rem; }
  .qty button:disabled { opacity: .35; cursor: not-allowed; }
  .qty span { min-width: 20px; text-align: center; font-weight: 700; font-size: .9rem; }
  .line-end { text-align: right; }
  .line-end .remove { cursor: pointer; border: 0; background: none; color: var(--ink-soft); font-size: .8rem; text-decoration: underline; padding: 4px 0 0; }
  .summary { padding-top: 16px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: .95rem; }
  .row.total { font-size: 1.15rem; font-weight: 700; margin-top: 8px; }
  .hint { margin: 10px 0 0; font-size: .85rem; color: var(--ink-soft); }
  .hint button { cursor: pointer; border: 0; background: none; color: var(--rose); font-weight: 700; text-decoration: underline; padding: 0; }
  .error { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--pearl); color: var(--danger); font-size: .88rem; }
  .error:empty { display: none; }
  #paypal-panier { margin-top: 14px; min-height: 48px; }
  .pay-placeholder { margin-top: 14px; padding: 12px; border-radius: 999px; text-align: center; font-size: .88rem; border: 1px dashed var(--sky); color: var(--ink-soft); }

  /* ---------- Fenêtres (compte, confirmation) ---------- */
  .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; z-index: 40; background: rgba(91, 74, 95, .3); backdrop-filter: blur(6px); }
  .modal.open { display: grid; }
  .modal-box {
    position: relative; background: var(--porcelain); border: 1px solid var(--line); border-radius: 32px;
    padding: 36px 28px 28px; width: min(420px, 100%); max-height: 88vh; overflow-y: auto; animation: rise .4s ease-out;
  }
  .modal-box > .close { position: absolute; top: 16px; right: 16px; }
  .modal-box h2 { margin: 0 0 6px; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 2.2rem; color: var(--rose); }
  .modal-box.center { text-align: center; }
  .modal-box p { margin: 0 0 18px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  form { display: grid; gap: 14px; margin-top: 16px; }
  label { display: grid; gap: 6px; font-size: .88rem; font-weight: 600; }
  input[type="email"], input[type="password"], input[type="text"] {
    font: inherit; color: var(--ink); padding: 11px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--pearl);
  }
  input:focus-visible { border-radius: 16px; }
  .switch { margin-top: 18px; text-align: center; font-size: .9rem; color: var(--ink-soft); }
  .switch button { cursor: pointer; border: 0; background: none; color: var(--rose); font-weight: 700; text-decoration: underline; padding: 0; }
  .orders { display: grid; gap: 12px; margin: 16px 0 22px; }
  .order { padding: 14px 16px; border-radius: 20px; background: var(--pearl); }
  .order-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: .92rem; }
  .order p { margin: 6px 0 0; font-size: .88rem; color: var(--ink-soft); }
  .status { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--blush); }
  .status.sent { background: var(--baby); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .3s;
    background: var(--ink); color: var(--porcelain); padding: 10px 20px; border-radius: 999px; font-size: .9rem; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .topbar { grid-template-columns: 1fr auto; grid-template-areas: "brand brand" "compte actions"; }
    .brand-small { grid-area: brand; justify-self: center; }
    #compteBtn { grid-area: compte; justify-self: start; }
    .actions { grid-area: actions; }
    .search { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero h1, .modal-box { animation: none; }
    .visual img, .drawer, .backdrop, .toast { transition: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="pill" id="compteBtn">Se connecter</button>
  <a class="brand-small" href="#" id="brandSmall"></a>
  <div class="actions">
    <input class="search" id="search" type="search" placeholder="Rechercher" aria-label="Rechercher un produit">
    <button class="pill rose cart-btn" id="panierBtn">Panier<span class="count" id="count" hidden>0</span></button>
  </div>
</div>

<header class="hero">
  <div class="puff p1"></div><div class="puff p2"></div><div class="puff p3"></div>
  <div class="hero-inner">
    <h1 id="shopName"></h1>
    <p id="slogan"></p>
  </div>
</header>

<main>
  <div class="intro">
    <h2>La collection</h2>
    <div class="tabs" id="tabs" role="group" aria-label="Filtrer par catégorie"></div>
  </div>
  <div id="notice"></div>
  <section class="grid" id="grid" aria-live="polite">
    <p class="empty">Chargement de la collection…</p>
  </section>
</main>

<footer>
  <p class="serif" id="brandFooter"></p>
  <nav>
    <a href="#">Mentions légales</a>
    <a href="#">Conditions de vente</a>
    <a href="#">Livraison et retours</a>
    <a href="#">Contact</a>
  </nav>
  <p>Paiement sécurisé par PayPal. Droit de rétractation de 14 jours.</p>
</footer>

<!-- Panier -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Panier" aria-hidden="true">
  <div class="drawer-head">
    <h2>Ton panier</h2>
    <button class="close" data-fermer-panier aria-label="Fermer le panier">×</button>
  </div>
  <div class="lines" id="lignes"></div>
  <div class="summary" id="resume"></div>
</aside>

<!-- Compte -->
<div class="modal" id="compteModal" role="dialog" aria-modal="true" aria-label="Mon compte">
  <div class="modal-box">
    <button class="close" data-fermer aria-label="Fermer">×</button>
    <div id="compteContenu"></div>
  </div>
</div>

<!-- Confirmation -->
<div class="modal" id="merciModal" role="dialog" aria-modal="true" aria-labelledby="merciTitre">
  <div class="modal-box center">
    <h2 id="merciTitre">Merci</h2>
    <p class="muted" id="merciTexte">Ta commande est confirmée. PayPal t’envoie un reçu par e-mail.</p>
    <button class="pill solid" data-fermer>Continuer mes achats</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  /* ---------- Données d’exemple (sans API_URL ni CSV_URL) ---------- */
  const DEMO = [
    { nom: "Tapis Mer de nuages", prix: "24,90", description: "Format XXL 90 × 40 cm, base antidérapante, bords cousus.", categorie: "Tapis de souris", badge: "Nouveau", stock: "" },
    { nom: "Tapis Aube poudrée", prix: "24,90", description: "Dégradé rose et bleu layette pour un bureau tout doux.", categorie: "Tapis de souris", badge: "", stock: "3" },
    { nom: "Stickers Ciel de soie", prix: "6,50", description: "12 stickers vinyle, finition satinée, résistants à l’eau.", categorie: "Papeterie", badge: "", stock: "" },
    { nom: "Mug Pétale", prix: "16,00", description: "Céramique 330 ml, compatible lave-vaisselle.", categorie: "Maison", badge: "", stock: "" },
    { nom: "Tote bag Cloudy’s", prix: "18,00", description: "Coton bio épais, assez grand pour un ordinateur portable.", categorie: "Accessoires", badge: "Édition limitée", stock: "0" },
    { nom: "Porte-clés Perle de nuage", prix: "8,90", description: "Acrylique double face de 6 cm, anneau doré.", categorie: "Accessoires", badge: "", stock: "" }
  ];

  /* ---------- Outils ---------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const prixNombre = p => { const n = parseFloat(String(p).replace(/[^\d,.-]/g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
  const euros = n => new Intl.NumberFormat("fr-FR", { style: "currency", currency: CONFIG.DEVISE }).format(n);
  const lire = (cle, defaut) => { try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch (e) { return defaut; } };
  const ecrire = (cle, v) => { try { v === null ? localStorage.removeItem(cle) : localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} };
  const stockNombre = s => (s === undefined || String(s).trim() === "" || isNaN(Number(s))) ? null : Number(s);
  const QTE_MAX = 10;

  const state = {
    produits: [], filtre: "Tout", recherche: "",
    panier: lire("cloudys_panier", []),
    session: lire("cloudys_session", null),
    livraison: { frais: CONFIG.FRAIS_PORT, seuil: CONFIG.SEUIL_LIVRAISON_GRATUITE }
  };

  async function api(action, data = {}) {
    const rep = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, token: state.session?.token, ...data })
    });
    return rep.json();
  }

  function toast(texte) {
    const t = $("toast");
    t.textContent = texte; t.classList.add("show");
    clearTimeout(toast.minuteur);
    toast.minuteur = setTimeout(() => t.classList.remove("show"), 2200);
  }

  ["shopName", "brandSmall", "brandFooter"].forEach(id => $(id).textContent = CONFIG.NOM_BOUTIQUE);
  $("slogan").textContent = CONFIG.SLOGAN;
  document.title = CONFIG.NOM_BOUTIQUE;

  /* ---------- Chargement des produits ---------- */
  function charger() {
    if (CONFIG.API_URL) {
      return fetch(CONFIG.API_URL + "?action=produits")
        .then(r => r.json())
        .then(d => {
          if (!d.ok) throw new Error(d.erreur);
          if (d.livraison) state.livraison = d.livraison;
          demarrer(d.produits);
        })
        .catch(() => { afficherNotice("La collection n’a pas pu être chargée. Vérifie API_URL et le déploiement Apps Script."); demarrer([]); });
    }
    if (CONFIG.CSV_URL) {
      return Papa.parse(CONFIG.CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        transformHeader: h => h.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""),
        complete: res => demarrer(res.data.filter(p => p.nom)),
        error: () => { afficherNotice("La Google Sheet n’a pas pu être lue. Vérifie qu’elle est publiée au format CSV."); demarrer([]); }
      });
    }
    afficherNotice("Produits d’exemple affichés. Colle l’URL de ton Apps Script dans API_URL pour afficher ta collection.");
    demarrer(DEMO);
  }

  function afficherNotice(t) { $("notice").innerHTML = t ? `<p class="notice">${esc(t)}</p>` : ""; }

  function demarrer(liste) {
    state.produits = liste.map((p, i) => ({ ...p, id: Number(p.id) || i + 1, prixN: prixNombre(p.prix) }));
    // retire du panier ce qui n’existe plus et ajuste au stock
    state.panier = state.panier
      .map(a => { const p = produit(a.id); return p ? { id: a.id, qte: Math.min(a.qte, maxQte(p)) } : null; })
      .filter(a => a && a.qte > 0);
    sauverPanier();
    construireOnglets(); afficher(); rendrePanier();
  }

  const produit = id => state.produits.find(p => p.id === Number(id));
  const maxQte = p => { const s = stockNombre(p.stock); return s === null ? QTE_MAX : Math.max(0, Math.min(QTE_MAX, s)); };

  /* ---------- Collection ---------- */
  function construireOnglets() {
    const cats = ["Tout", ...new Set(state.produits.map(p => (p.categorie || "").trim()).filter(Boolean))];
    const box = $("tabs");
    if (cats.length < 3) { box.innerHTML = ""; return; }
    box.innerHTML = cats.map(c => `<button class="tab" aria-pressed="${c === state.filtre}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  }
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    state.filtre = b.dataset.cat; construireOnglets(); afficher();
  });
  $("search").addEventListener("input", e => { state.recherche = e.target.value.trim().toLowerCase(); afficher(); });

  function visuel(p, i, classe = "visual") {
    return p.image
      ? `<div class="${classe}"><img src="${esc(p.image)}" alt="${esc(p.nom)}" loading="lazy">`
      : `<div class="${classe} placeholder ${i % 2 ? "blue" : "pink"}"><span class="monogram" aria-hidden="true">${esc(p.nom.trim().charAt(0))}</span>`;
  }

  function afficher() {
    const liste = state.produits.filter(p =>
      (state.filtre === "Tout" || (p.categorie || "").trim() === state.filtre) &&
      (!state.recherche || (p.nom + " " + (p.description || "")).toLowerCase().includes(state.recherche)));
    if (!liste.length) {
      $("grid").innerHTML = state.recherche
        ? `<p class="empty">Aucun produit ne correspond à « ${esc(state.recherche)} ».</p>`
        : `<p class="empty">La collection est vide. Ajoute une ligne dans ta Google Sheet pour la voir ici.</p>`;
      return;
    }
    $("grid").innerHTML = liste.map((p, i) => `
      <article class="product">
        ${visuel(p, i)}${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ""}</div>
        <div class="meta"><h3>${esc(p.nom)}</h3><span class="price">${euros(p.prixN)}</span></div>
        ${p.categorie ? `<p class="cat">${esc(p.categorie)}</p>` : ""}
        <p class="desc">${esc(p.description)}</p>
        ${maxQte(p) === 0
          ? `<div class="soldout">Épuisé</div>`
          : `<button class="pill solid wide" data-ajouter="${p.id}">Ajouter au panier</button>`}
      </article>`).join("");
  }
  $("grid").addEventListener("click", e => {
    const b = e.target.closest("[data-ajouter]"); if (b) ajouter(Number(b.dataset.ajouter));
  });

  /* ---------- Panier ---------- */
  function sauverPanier() { ecrire("cloudys_panier", state.panier); }

  function ajouter(id) {
    const p = produit(id); if (!p) return;
    const ligne = state.panier.find(a => a.id === id);
    const actuelle = ligne ? ligne.qte : 0;
    if (actuelle >= maxQte(p)) { toast(maxQte(p) === QTE_MAX ? `Maximum ${QTE_MAX} par article` : `Il ne reste que ${maxQte(p)} exemplaire(s)`); return; }
    ligne ? ligne.qte++ : state.panier.push({ id, qte: 1 });
    sauverPanier(); rendrePanier(); toast(`« ${p.nom} » ajouté au panier`);
  }

  function changerQte(id, delta) {
    const ligne = state.panier.find(a => a.id === id); if (!ligne) return;
    ligne.qte = Math.min(maxQte(produit(id)), ligne.qte + delta);
    if (ligne.qte <= 0) state.panier = state.panier.filter(a => a.id !== id);
    sauverPanier(); rendrePanier();
  }

  function totaux() {
    const sousTotal = state.panier.reduce((s, a) => s + Math.round(produit(a.id).prixN * 100) * a.qte, 0);
    const seuil = Number(state.livraison.seuil) || 0;
    const port = !sousTotal ? 0 : (seuil > 0 && sousTotal >= seuil * 100) ? 0 : Math.round(Number(state.livraison.frais) * 100);
    return { sousTotal, port, total: sousTotal + port };
  }

  function rendrePanier() {
    const nb = state.panier.reduce((s, a) => s + a.qte, 0);
    $("count").textContent = nb; $("count").hidden = !nb;

    if (!state.panier.length) {
      $("lignes").innerHTML = `<p class="empty">Ton panier est vide pour l’instant.</p>`;
      $("resume").innerHTML = `<button class="pill solid wide" data-fermer-panier>Découvrir la collection</button>`;
      return;
    }

    $("lignes").innerHTML = state.panier.map((a, i) => {
      const p = produit(a.id);
      const mini = p.image ? `<img src="${esc(p.image)}" alt="">` : `<span>${esc(p.nom.charAt(0))}</span>`;
      return `
        <div class="line">
          <div class="mini" style="${i % 2 ? "background:var(--baby)" : ""}">${mini}</div>
          <div>
            <h4>${esc(p.nom)}</h4>
            <div class="qty">
              <button data-moins="${a.id}" aria-label="Retirer un exemplaire">−</button>
              <span>${a.qte}</span>
              <button data-plus="${a.id}" aria-label="Ajouter un exemplaire" ${a.qte >= maxQte(p) ? "disabled" : ""}>+</button>
            </div>
          </div>
          <div class="line-end">
            <div>${euros(p.prixN * a.qte)}</div>
            <button class="remove" data-retirer="${a.id}">Retirer</button>
          </div>
        </div>`;
    }).join("");

    const t = totaux();
    const seuil = Number(state.livraison.seuil) || 0;
    const reste = seuil > 0 ? seuil * 100 - t.sousTotal : 0;
    const compte = !CONFIG.API_URL ? ""
      : state.session
        ? `<p class="hint">Commande enregistrée sur ton compte ${esc(state.session.client?.nom || "")}.</p>`
        : `<p class="hint"><button data-ouvrir-compte>Connecte-toi</button> pour retrouver cette commande dans ton compte.</p>`;

    $("resume").innerHTML = `
      <div class="row"><span>Sous-total</span><span>${euros(t.sousTotal / 100)}</span></div>
      <div class="row"><span>Livraison</span><span>${t.port ? euros(t.port / 100) : "Offerte"}</span></div>
      ${reste > 0 ? `<p class="hint">Plus que ${euros(reste / 100)} pour la livraison offerte.</p>` : ""}
      <div class="row total"><span>Total</span><span>${euros(t.total / 100)}</span></div>
      ${compte}
      <p class="error" id="erreurPanier"></p>
      ${CONFIG.PAYPAL_ID ? `<div id="paypal-panier"></div>` : `<div class="pay-placeholder">Bouton PayPal à configurer (PAYPAL_ID)</div>`}`;
    initPaypal();
  }

  $("lignes").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.plus) changerQte(Number(b.dataset.plus), 1);
    if (b.dataset.moins) changerQte(Number(b.dataset.moins), -1);
    if (b.dataset.retirer) changerQte(Number(b.dataset.retirer), -QTE_MAX);
  });

  function ouvrirPanier() {
    $("drawer").classList.add("open"); $("backdrop").classList.add("open");
    $("drawer").setAttribute("aria-hidden", "false"); document.body.classList.add("locked");
    $("drawer").querySelector(".close").focus();
  }
  function fermerPanier() {
    $("drawer").classList.remove("open"); $("backdrop").classList.remove("open");
    $("drawer").setAttribute("aria-hidden", "true"); document.body.classList.remove("locked");
  }
  $("panierBtn").onclick = ouvrirPanier;
  $("backdrop").onclick = fermerPanier;

  const erreurPanier = t => { const el = $("erreurPanier"); if (el) el.textContent = t || ""; };

  /* ---------- PayPal (un seul bouton pour tout le panier) ---------- */
  let paypalPromesse;
  function chargerPaypal() {
    if (!paypalPromesse) paypalPromesse = new Promise((ok, ko) => {
      const s = document.createElement("script");
      s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(CONFIG.PAYPAL_ID)}&currency=${CONFIG.DEVISE}&locale=fr_FR&components=buttons`;
      s.onload = ok; s.onerror = ko; document.head.appendChild(s);
    });
    return paypalPromesse;
  }

  function initPaypal() {
    if (!CONFIG.PAYPAL_ID) return;
    chargerPaypal().then(() => {
      const conteneur = $("paypal-panier");
      if (!conteneur || conteneur.childElementCount) return;
      paypal.Buttons({
        fundingSource: paypal.FUNDING.PAYPAL,
        style: { shape: "pill", color: "white", height: 46, label: "pay" },

        createOrder: async (data, actions) => {
          erreurPanier("");
          if (CONFIG.API_URL) {
            const r = await api("creerCommande", { panier: state.panier });
            if (!r.ok) { erreurPanier(r.erreur); throw new Error(r.erreur); }
            return r.id;
          }
          // Mode test sans Apps Script (montant non vérifié)
          const t = totaux();
          return actions.order.create({
            purchase_units: [{
              amount: {
                currency_code: CONFIG.DEVISE, value: (t.total / 100).toFixed(2),
                breakdown: {
                  item_total: { currency_code: CONFIG.DEVISE, value: (t.sousTotal / 100).toFixed(2) },
                  shipping: { currency_code: CONFIG.DEVISE, value: (t.port / 100).toFixed(2) }
                }
              },
              items: state.panier.map(a => {
                const p = produit(a.id);
                return { name: p.nom.slice(0, 127), quantity: String(a.qte), unit_amount: { currency_code: CONFIG.DEVISE, value: p.prixN.toFixed(2) } };
              })
            }]
          });
        },

        onApprove: async (data, actions) => {
          if (CONFIG.API_URL) {
            const r = await api("capturerCommande", { orderId: data.orderID });
            if (r.recommencer) { erreurPanier(r.erreur); return actions.restart(); }
            if (r.ok || r.deja) return commandeReussie(r.prenom);
            erreurPanier(r.erreur || "Ton paiement est en cours de vérification. Tu recevras un e-mail dès qu’il est confirmé.");
            return;
          }
          const details = await actions.order.capture();
          commandeReussie(details?.payer?.name?.given_name);
        },

        onError: () => erreurPanier("Le paiement n’a pas abouti. Aucun montant n’a été débité, tu peux réessayer.")
      }).render(conteneur);
    }).catch(() => erreurPanier("PayPal n’a pas pu se charger. Vérifie ta connexion et ton PAYPAL_ID."));
  }

  function commandeReussie(prenom) {
    state.panier = []; sauverPanier(); fermerPanier(); rendrePanier();
    $("merciTitre").textContent = prenom ? `Merci ${prenom}` : "Merci";
    $("merciTexte").textContent = state.session
      ? "Ta commande est confirmée. Tu la retrouves dans ton compte, et PayPal t’envoie un reçu par e-mail."
      : "Ta commande est confirmée. PayPal t’envoie un reçu par e-mail.";
    ouvrirModal("merciModal");
    charger();
  }

  /* ---------- Fenêtres ---------- */
  function ouvrirModal(id) {
    $(id).classList.add("open"); document.body.classList.add("locked");
    setTimeout(() => ($(id).querySelector("input, .pill") || $(id)).focus(), 50);
  }
  function fermerModales() {
    document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open"));
    if (!$("drawer").classList.contains("open")) document.body.classList.remove("locked");
  }
  document.addEventListener("click", e => {
    if (e.target.closest("[data-fermer]") || e.target.classList.contains("modal")) fermerModales();
    if (e.target.closest("[data-fermer-panier]")) fermerPanier();
    if (e.target.closest("[data-ouvrir-compte]")) ouvrirCompte();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { fermerModales(); fermerPanier(); } });

  /* ---------- Compte client ---------- */
  function majBoutonCompte() {
    const nom = state.session?.client?.nom;
    $("compteBtn").textContent = state.session ? (nom ? `Bonjour ${nom}` : "Mon compte") : "Se connecter";
  }
  $("compteBtn").onclick = () => ouvrirCompte();

  function ouvrirCompte(vue) { rendreCompte(vue); ouvrirModal("compteModal"); }

  function rendreCompte(vue = "connexion") {
    const box = $("compteContenu");
    if (!CONFIG.API_URL) {
      box.innerHTML = `<h2>Mon compte</h2><p class="muted">Les comptes clients s’activent dès que ton Apps Script est relié (API_URL).</p>`;
      return;
    }
    if (state.session) {
      box.innerHTML = `
        <h2>Bonjour ${esc(state.session.client?.nom || "")}</h2>
        <p class="muted">${esc(state.session.client?.email || "")}</p>
        <h3 class="serif" style="font-weight:500;font-size:1.4rem;margin:8px 0 0">Mes commandes</h3>
        <div class="orders" id="historique"><p class="muted">Chargement…</p></div>
        <button class="pill wide" id="deconnexionBtn">Se déconnecter</button>`;
      $("deconnexionBtn").onclick = seDeconnecter;
      chargerHistorique();
      return;
    }
    const inscription = vue === "inscription";
    box.innerHTML = `
      <h2>${inscription ? "Créer un compte" : "Se connecter"}</h2>
      <p class="muted">${inscription ? "Pour suivre tes commandes au même endroit." : "Pour retrouver tes commandes."}</p>
      <form id="formCompte" novalidate>
        ${inscription ? `<label>Prénom<input type="text" name="nom" autocomplete="given-name" maxlength="60" required></label>` : ""}
        <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
        <label>Mot de passe<input type="password" name="motdepasse" minlength="8" autocomplete="${inscription ? "new-password" : "current-password"}" required></label>
        <p class="error" id="erreurCompte"></p>
        <button class="pill solid wide" type="submit">${inscription ? "Créer mon compte" : "Se connecter"}</button>
      </form>
      <p class="switch">${inscription
        ? `Déjà un compte ? <button data-vue="connexion">Se connecter</button>`
        : `Pas encore de compte ? <button data-vue="inscription">Créer un compte</button>`}</p>`;
    box.querySelector("[data-vue]").onclick = e => { rendreCompte(e.target.dataset.vue); box.querySelector("input").focus(); };
    $("formCompte").onsubmit = e => soumettreCompte(e, inscription);
  }

  async function soumettreCompte(e, inscription) {
    e.preventDefault();
    const f = e.target, bouton = f.querySelector("button[type=submit]");
    const donnees = Object.fromEntries(new FormData(f));
    if (inscription && donnees.motdepasse.length < 8) { $("erreurCompte").textContent = "Le mot de passe doit contenir au moins 8 caractères."; return; }
    bouton.disabled = true; bouton.textContent = "Un instant…"; $("erreurCompte").textContent = "";
    try {
      const r = await api(inscription ? "inscription" : "connexion", donnees);
      if (!r.ok) throw new Error(r.erreur);
      state.session = { token: r.token, client: r.client };
      ecrire("cloudys_session", state.session);
      majBoutonCompte(); rendrePanier(); rendreCompte();
      toast(inscription ? "Compte créé, bienvenue !" : "Connexion réussie");
    } catch (err) {
      $("erreurCompte").textContent = err.message || "Connexion impossible. Réessaie dans un instant.";
      bouton.disabled = false; bouton.textContent = inscription ? "Créer mon compte" : "Se connecter";
    }
  }

  async function chargerHistorique() {
    try {
      const r = await api("moi");
      if (r.deconnecte) { oublierSession(); rendreCompte(); return; }
      if (!r.ok) throw new Error(r.erreur);
      const h = $("historique"); if (!h) return;
      h.innerHTML = r.commandes.length ? r.commandes.map(c => `
        <div class="order">
          <div class="order-top"><span>${esc(c.date)}</span><span>${euros(c.total)}</span></div>
          <p>${esc(c.articles).replace(/\n/g, "<br>")}</p>
          <p><span class="status ${c.expediee ? "sent" : ""}">${c.expediee ? "Expédiée" : "En préparation"}</span></p>
        </div>`).join("")
        : `<p class="muted">Aucune commande pour l’instant.</p>`;
    } catch (err) {
      const h = $("historique"); if (h) h.innerHTML = `<p class="muted">Tes commandes n’ont pas pu être chargées.</p>`;
    }
  }

  function oublierSession() { state.session = null; ecrire("cloudys_session", null); majBoutonCompte(); rendrePanier(); }
  async function seDeconnecter() {
    try { await api("deconnexion"); } catch (e) {}
    oublierSession(); rendreCompte(); toast("Tu es déconnecté·e");
  }

  majBoutonCompte();
  charger();
</script>
</body>
</html>
